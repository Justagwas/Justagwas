name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          core_version: 2.2.0
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&bg_color=45,0d1117,151a23&icon_color=7aa2f7&text_color=c9d1d9&title_color=c9d1d9&card_width=460
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        shell: bash
        run: |
          git add -- profile/stats.svg
          if git diff --cached --quiet -- profile/stats.svg; then
            echo "Stats card is unchanged."
            exit 0
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README cards"
          git push
